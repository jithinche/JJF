<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJ Family Finance</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; background-color: #f8fafc; }
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- INLINE ICONS ---
        const IconHome = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        );
        const IconCreditCard = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
        );
        const IconTrendingUp = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const IconPlus = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        );
        const IconSettings = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        );
        const IconDownload = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );

        // --- INITIAL EDITABLE DATASET ---
        const INITIAL_ACCOUNTS = [
          { id: 'j-curr', name: 'Jithu AIB Current', owner: 'Jithu', type: 'current', balance: 666.48 },
          { id: 'j-sav', name: 'Jithu AIB Savings', owner: 'Jithu', type: 'savings', balance: 2.54 },
          { id: 'j-cash', name: 'Jithu Cash', owner: 'Jithu', type: 'cash', balance: 0 },
          { id: 'j-cc', name: 'Jithu AIB Credit', owner: 'Jithu', type: 'credit', balance: -1471.74, limit: 1500 },
          { id: 'j-loan', name: 'AIB Loan', owner: 'Jithu', type: 'loan', balance: -763.00 },
          { id: 'j-humm', name: 'Humm', owner: 'Jithu', type: 'loan', balance: -538.00 },
          
          { id: 'jo-curr', name: 'Josna AIB Current', owner: 'Josna', type: 'current', balance: 1239.92 },
          { id: 'jo-sav', name: 'Josna AIB Savings', owner: 'Josna', type: 'savings', balance: 277.82 },
          { id: 'jo-cash', name: 'Josna Cash', owner: 'Josna', type: 'cash', balance: 0 },
          { id: 'jo-cc', name: 'Josna AIB Credit', owner: 'Josna', type: 'credit', balance: -525.54, limit: 1500 },

          { id: 'inv-stk', name: 'Revolut Stocks', owner: 'Family', type: 'investment', balance: 570.00 },
          { id: 'inv-cry', name: 'Revolut Crypto', owner: 'Family', type: 'investment', balance: 223.00 },
        ];

        const INITIAL_CATEGORIES = [
          'Mortgage/Rent', 'Groceries', 'Eating Out', 'Utilities', 'Car/Transport', 
          'Childcare/Jewel', 'India Commitments', 'Shopping', 'Health', 'Subscriptions', 'Income'
        ];

        function JJFamilyFinance() {
          const [activeTab, setActiveTab] = useState('home');
          const [accounts, setAccounts] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [showTxModal, setShowTxModal] = useState(false);
          const [txFormType, setTxFormType] = useState('expense');

          useEffect(() => {
            const savedAccounts = localStorage.getItem('jj_accounts');
            const savedTransactions = localStorage.getItem('jj_transactions');
            
            if (savedAccounts) setAccounts(JSON.parse(savedAccounts));
            else setAccounts(INITIAL_ACCOUNTS);

            if (savedTransactions) setTransactions(JSON.parse(savedTransactions));
          }, []);

          useEffect(() => {
            if (accounts.length > 0) {
              localStorage.setItem('jj_accounts', JSON.stringify(accounts));
              localStorage.setItem('jj_transactions', JSON.stringify(transactions));
            }
          }, [accounts, transactions]);

          const currentMonth = new Date().getMonth();
          const currentYear = new Date().getFullYear();

          const thisMonthTx = transactions.filter(tx => {
            const d = new Date(tx.date);
            return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
          });

          const incomeThisMonth = thisMonthTx
            .filter(tx => tx.type === 'income')
            .reduce((sum, tx) => sum + parseFloat(tx.amount), 0);

          const spentThisMonth = thisMonthTx
            .filter(tx => tx.type === 'expense')
            .reduce((sum, tx) => sum + parseFloat(tx.amount), 0);

          const savedThisMonth = incomeThisMonth - spentThisMonth;

          const familyMoneyInHand = accounts
            .filter(a => ['current', 'savings', 'cash'].includes(a.type))
            .reduce((sum, a) => sum + a.balance, 0);
            
          const totalDebt = accounts
            .filter(a => ['credit', 'loan'].includes(a.type))
            .reduce((sum, a) => sum + a.balance, 0);

          const handleAddTransaction = (tx) => {
            const newTx = { ...tx, id: Date.now().toString(), amount: parseFloat(tx.amount) };
            
            setAccounts(prev => prev.map(acc => {
              let newBalance = acc.balance;
              if (tx.type === 'income' && acc.id === tx.accountId) newBalance += newTx.amount;
              else if (tx.type === 'expense' && acc.id === tx.accountId) newBalance -= newTx.amount;
              else if (tx.type === 'transfer') {
                if (acc.id === tx.sourceId) newBalance -= newTx.amount;
                if (acc.id === tx.destinationId) newBalance += newTx.amount;
              }
              return { ...acc, balance: newBalance };
            }));

            setTransactions(prev => [newTx, ...prev]);
            setShowTxModal(false);
          };

          const handleReconcile = (accountId, actualBalance) => {
            const acc = accounts.find(a => a.id === accountId);
            if (!acc) return;
            
            const diff = parseFloat(actualBalance) - acc.balance;
            if (diff === 0) return;

            handleAddTransaction({
              date: new Date().toISOString().split('T')[0],
              amount: Math.abs(diff),
              type: diff > 0 ? 'income' : 'expense',
              category: 'Adjustment',
              description: 'Manual Bank Reconciliation',
              accountId: accountId,
              owner: 'Family'
            });
          };

          const deleteTransaction = (txId) => {
            const tx = transactions.find(t => t.id === txId);
            if (!tx) return;

            setAccounts(prev => prev.map(acc => {
              let newBalance = acc.balance;
              if (tx.type === 'income' && acc.id === tx.accountId) newBalance -= tx.amount;
              else if (tx.type === 'expense' && acc.id === tx.accountId) newBalance += tx.amount;
              else if (tx.type === 'transfer') {
                if (acc.id === tx.sourceId) newBalance += tx.amount;
                if (acc.id === tx.destinationId) newBalance -= tx.amount;
              }
              return { ...acc, balance: newBalance };
            }));

            setTransactions(prev => prev.filter(t => t.id !== txId));
          };

          const Dashboard = () => (
            <div className="space-y-6 pb-24">
              <div className="bg-gradient-to-br from-indigo-900 to-slate-800 rounded-2xl p-6 text-white shadow-lg">
                <h2 className="text-indigo-200 text-sm font-medium mb-1">Family Money In Hand</h2>
                <div className="text-4xl font-light mb-4">€{familyMoneyInHand.toFixed(2)}</div>
                <div className="flex justify-between text-sm border-t border-indigo-700 pt-3">
                  <div>
                    <span className="text-indigo-300 block text-xs">Total Debt (Cards/Loans)</span>
                    <span className="text-red-300">€{Math.abs(totalDebt).toFixed(2)}</span>
                  </div>
                  <div className="text-right">
                    <span className="text-indigo-300 block text-xs">Investments</span>
                    <span className="text-emerald-300">
                      €{accounts.filter(a=>a.type==='investment').reduce((sum,a)=>sum+a.balance,0).toFixed(2)}
                    </span>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                  <div className="flex items-center gap-2 mb-1">
                    <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                    <h3 className="text-slate-500 text-xs font-medium uppercase tracking-wider">In This Month</h3>
                  </div>
                  <div className="text-xl font-medium text-slate-800">€{incomeThisMonth.toFixed(2)}</div>
                </div>
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                  <div className="flex items-center gap-2 mb-1">
                    <div className="w-2 h-2 rounded-full bg-rose-500"></div>
                    <h3 className="text-slate-500 text-xs font-medium uppercase tracking-wider">Out This Month</h3>
                  </div>
                  <div className="text-xl font-medium text-slate-800">€{spentThisMonth.toFixed(2)}</div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                  <h3 className="text-slate-500 text-xs font-medium uppercase tracking-wider mb-1">Saved This Month</h3>
                  <div className={`text-2xl font-medium ${savedThisMonth >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    {savedThisMonth >= 0 ? '+' : ''}€{savedThisMonth.toFixed(2)}
                  </div>
                </div>
                <IconTrendingUp className={savedThisMonth >= 0 ? 'text-emerald-200' : 'text-rose-200'} size={40} />
              </div>

              <div>
                <h3 className="text-lg font-semibold text-slate-800 mb-3">Live Accounts</h3>
                <div className="space-y-3">
                  {accounts.filter(a => ['current', 'savings', 'cash'].includes(a.type)).map(acc => (
                    <div key={acc.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                      <div>
                        <h4 className="font-medium text-slate-800">{acc.name}</h4>
                        <p className="text-xs text-slate-400 capitalize">{acc.type} • {acc.owner}</p>
                      </div>
                      <div className="text-right">
                        <div className="font-medium text-slate-800">€{acc.balance.toFixed(2)}</div>
                        <button 
                          onClick={() => {
                            const actual = prompt(`Reconcile ${acc.name}\nEnter actual bank balance:`, acc.balance);
                            if(actual !== null && !isNaN(actual)) handleReconcile(acc.id, actual);
                          }}
                          className="text-xs text-indigo-500 font-medium hover:underline"
                        >
                          Reconcile
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );

          const TransactionList = () => (
            <div className="space-y-4 pb-24">
              <h2 className="text-2xl font-semibold text-slate-800 mb-6">Recent Activity</h2>
              {transactions.length === 0 ? (
                <div className="text-center p-8 text-slate-400">No transactions yet.</div>
              ) : (
                transactions.map(tx => (
                  <div key={tx.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1">
                        <h4 className="font-medium text-slate-800">{tx.description || tx.category}</h4>
                        {tx.trip && <span className="bg-indigo-100 text-indigo-700 text-[10px] px-2 py-0.5 rounded-full font-medium">Trip: {tx.trip}</span>}
                      </div>
                      <p className="text-xs text-slate-400">
                        {tx.date} • {tx.type === 'transfer' ? `Transfer` : tx.category} • {tx.owner}
                      </p>
                    </div>
                    <div className="text-right">
                      <div className={`font-medium ${
                        tx.type === 'income' ? 'text-emerald-600' : 
                        tx.type === 'expense' ? 'text-rose-600' : 'text-slate-600'
                      }`}>
                        {tx.type === 'income' ? '+' : tx.type === 'expense' ? '-' : ''}€{tx.amount.toFixed(2)}
                      </div>
                      <button onClick={() => deleteTransaction(tx.id)} className="text-xs text-red-400 hover:text-red-600 mt-1">
                        Delete
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          );

          const SettingsView = () => (
            <div className="space-y-6 pb-24">
              <h2 className="text-2xl font-semibold text-slate-800 mb-6">Data & Safety</h2>
              <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div className="p-4 border-b border-slate-50 flex items-center justify-between">
                  <div>
                    <h4 className="font-medium text-slate-800">Export JSON</h4>
                    <p className="text-xs text-slate-500">Backup your entire financial history</p>
                  </div>
                  <button className="p-2 bg-indigo-50 text-indigo-600 rounded-lg" onClick={() => {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({accounts, transactions}));
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", `jj_finance_backup_${new Date().toISOString().split('T')[0]}.json`);
                    dlAnchorElem.click();
                  }}>
                    <IconDownload size={20} />
                  </button>
                </div>
                <div className="p-4 flex items-center justify-between">
                   <div>
                    <h4 className="font-medium text-red-600">Danger Zone</h4>
                    <p className="text-xs text-slate-500">Reset all data to prompt defaults</p>
                  </div>
                  <button onClick={() => {
                    if(window.confirm("Erase all data and reset?")) {
                      setAccounts(INITIAL_ACCOUNTS);
                      setTransactions([]);
                    }
                  }} className="px-4 py-2 bg-red-50 text-red-600 font-medium text-sm rounded-lg">
                    Factory Reset
                  </button>
                </div>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans max-w-md mx-auto relative shadow-2xl overflow-hidden border-x border-slate-200">
              <header className="px-6 py-5 bg-white border-b border-slate-100 flex justify-between items-center sticky top-0 z-10">
                <div>
                  <h1 className="text-xl font-bold text-slate-800 tracking-tight">JJ Finance</h1>
                  <p className="text-[10px] font-medium text-slate-400 uppercase tracking-widest">Know. Control. Grow.</p>
                </div>
                <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">JJ</div>
              </header>

              <main className="p-6 h-[calc(100vh-140px)] overflow-y-auto">
                {activeTab === 'home' && <Dashboard />}
                {activeTab === 'spending' && <TransactionList />}
                {activeTab === 'settings' && <SettingsView />}
              </main>

              <button 
                onClick={() => setShowTxModal(true)}
                className="absolute bottom-24 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg shadow-indigo-200 flex items-center justify-center hover:bg-indigo-700 transition-transform active:scale-95 z-20"
              >
                <IconPlus size={28} />
              </button>

              <nav className="absolute bottom-0 w-full bg-white border-t border-slate-100 flex justify-around p-4 pb-6 z-10">
                <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-indigo-600' : 'text-slate-400'}`}>
                  <IconHome size={22} />
                  <span className="text-[10px] font-medium">Home</span>
                </button>
                <button onClick={() => setActiveTab('spending')} className={`flex flex-col items-center gap-1 ${activeTab === 'spending' ? 'text-indigo-600' : 'text-slate-400'}`}>
                  <IconCreditCard size={22} />
                  <span className="text-[10px] font-medium">Log</span>
                </button>
                <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-1 ${activeTab === 'settings' ? 'text-indigo-600' : 'text-slate-400'}`}>
                  <IconSettings size={22} />
                  <span className="text-[10px] font-medium">Data</span>
                </button>
              </nav>

              {showTxModal && (
                <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex flex-col justify-end">
                  <div className="bg-white rounded-t-3xl p-6 shadow-2xl" style={{ animation: 'slideUp 0.3s ease-out' }}>
                    <div className="flex justify-between items-center mb-6">
                      <h3 className="text-xl font-semibold">New Entry</h3>
                      <button onClick={() => setShowTxModal(false)} className="text-slate-400 p-2 rounded-full bg-slate-100">✕</button>
                    </div>
                    
                    <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                      {['expense', 'transfer', 'income'].map(type => (
                        <button
                          key={type}
                          onClick={() => setTxFormType(type)}
                          className={`flex-1 py-2 text-sm font-medium rounded-lg capitalize transition-colors ${
                            txFormType === type ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'
                          }`}
                        >
                          {type}
                        </button>
                      ))}
                    </div>

                    <form onSubmit={(e) => {
                      e.preventDefault();
                      const fd = new FormData(e.target);
                      handleAddTransaction({
                        type: txFormType,
                        date: fd.get('date'),
                        amount: fd.get('amount'),
                        description: fd.get('description'),
                        category: txFormType === 'transfer' ? 'Transfer' : fd.get('category'),
                        owner: fd.get('owner'),
                        accountId: fd.get('accountId'),
                        sourceId: fd.get('sourceId'),
                        destinationId: fd.get('destinationId'),
                        trip: fd.get('trip')
                      });
                    }} className="space-y-4">
                      
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="text-xs font-medium text-slate-500 mb-1 block">Amount</label>
                          <input required name="amount" type="number" step="0.01" className="w-full border border-slate-200 rounded-xl px-4 py-3 text-lg" placeholder="0.00" />
                        </div>
                        <div>
                          <label className="text-xs font-medium text-slate-500 mb-1 block">Date</label>
                          <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full border border-slate-200 rounded-xl px-4 py-3" />
                        </div>
                      </div>

                      <div>
                        <label className="text-xs font-medium text-slate-500 mb-1 block">Description</label>
                        <input required name="description" type="text" className="w-full border border-slate-200 rounded-xl px-4 py-3" placeholder="e.g. Tesco Grocery" />
                      </div>

                      {txFormType !== 'transfer' ? (
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="text-xs font-medium text-slate-500 mb-1 block">Account</label>
                            <select required name="accountId" className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white">
                              {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name} (€{acc.balance.toFixed(0)})</option>)}
                            </select>
                          </div>
                          <div>
                            <label className="text-xs font-medium text-slate-500 mb-1 block">Category</label>
                            <select required name="category" className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white">
                              {INITIAL_CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                            </select>
                          </div>
                        </div>
                      ) : (
                        <div className="grid grid-cols-2 gap-4 bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                          <div>
                            <label className="text-xs font-medium text-indigo-600 mb-1 block">From</label>
                            <select required name="sourceId" className="w-full border border-slate-200 rounded-xl px-2 py-3 bg-white text-sm">
                               {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                            </select>
                          </div>
                          <div>
                            <label className="text-xs font-medium text-indigo-600 mb-1 block">To Account / Card</label>
                            <select required name="destinationId" className="w-full border border-slate-200 rounded-xl px-2 py-3 bg-white text-sm">
                               {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                            </select>
                          </div>
                        </div>
                      )}

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="text-xs font-medium text-slate-500 mb-1 block">Who</label>
                          <select name="owner" className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white">
                            <option value="Family">Family</option>
                            <option value="Jithu">Jithu</option>
                            <option value="Josna">Josna</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-xs font-medium text-slate-500 mb-1 block">Trip Tag</label>
                          <select name="trip" className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white">
                            <option value="">None</option>
                            <option value="India 2026">India Trip 2026</option>
                          </select>
                        </div>
                      </div>

                      <button type="submit" className="w-full bg-indigo-600 text-white font-semibold py-4 rounded-xl mt-4 hover:bg-indigo-700">
                        Save Entry
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<JJFamilyFinance />);
    </script>
