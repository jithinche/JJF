<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f4"><title>JJ Family Finance</title><style>

font-size:17px;margin:0;letter-spacing:-.3px}.muted{color:var(--muted)}.accounts{display:grid;grid-template-columns:1fr 1fr;gap:13px}.person h3{margin:0 0 12px;font-size:15px}.accountrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.accountrow span{color:var(--muted)}.accountrow button{padding:0;background:none;color:var(--ink);font-weight:700}.accountrow button:hover{color:var(--green)}.monthgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.simplelist{display:grid;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.rowtitle{font-weight:650}.rowmeta{font-size:12px;color:var(--muted);margin-top:3px}.rowamt{font-weight:750;white-space:nowrap}.negative{color:var(--red)}.positive{color:var(--green)}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d5ded7;border-radius:16px}.toolbar{display:flex;align-items:center;gap:9px}.toolbar select,.toolbar input{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;color:var(--ink)}.modalwrap{position:fixed;inset:0;background:#10241c73;z-index:5;display:none;align-items:flex-end;justify-content:center;padding:16px}.modalwrap.show{display:flex}.modal{background:#fff;border-radius:22px;width:min(540px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 70px #071d14aa}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{font-size:20px;margin:0}.close{background:#f1f4f1;border-radius:10px;padding:7px 11px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}.formbuttons{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;margin-top:8px}.delete{background:#fff2f0;color:var(--red);border-radius:11px;padding:11px 13px}.save{margin-left:auto}.monthnav{display:flex;gap:8px;align-items:center}.monthnav button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px}.progressbar{height:9px;border-radius:99px;background:#edf1ed;overflow:hidden;margin-top:10px}.progressbar i{display:block;height:100%;background:var(--green);border-radius:99px}.tripcard{padding:18px}.triphead{display:flex;justify-content:space-between;align-items:flex-start}.triphead h3{margin:0}.triptotal{font-size:24px;font-weight:750;margin-top:12px}.pill{font-size:11px;background:var(--mint);color:var(--green);border-radius:99px;padding:5px 9px;font-weight:700}.mobileadd{display:none}.foot{font-size:11px;color:var(--muted);text-align:center;margin:30px 0 0}

</style></head><body><main class="app"><header class="top"><div class="brand">JJ <span style="color:var(--green)">Family Finance</span><small>Your money, simply in view</small></div><div class="actions"><button class="secondary" id="backupBtn">Backup</button><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button></div></header><nav class="tabs" aria-label="Main areas"><button class="tab active" data-page="home">Home</button><button class="tab" data-page="spending">Spending</button><button class="tab" data-page="trips">Trips</button><button class="tab" data-page="progress">Progress</button></nav><div id="view"></div><button class="mobileadd" id="quickAdd" aria-label="Add">+</button><p class="foot">Stored privately in this browser · <button id="backupLink" style="background:none;color:var(--green);padding:0">Backup or restore</button></p></main><div class="modalwrap" id="modalwrap"><section class="modal"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" id="closeModal">✕</button></div><div id="modalBody"></div></section></div><input type="file" id="restoreFile" accept="application/json" hidden><script>
(()=>{'use strict';const KEY='jj-family-finance-v1';const today=()=>new Date().toISOString().slice(0,10);const monthNow=()=>today().slice(0,7);const seed=()=>({version:1,accounts:[{id:'j-current',person:'Jithu',type:'Current',balance:0},{id:'j-savings',person:'Jithu',type:'Savings',balance:0},{id:'j-card',person:'Jithu',type:'Credit Card',balance:0},{id:'j-cash',person:'Jithu',type:'Cash',balance:0},{id:'s-current',person:'Josna',type:'Current',balance:0},{id:'s-savings',person:'Josna',type:'Savings',balance:0},{id:'s-card',person:'Josna',type:'Credit Card',balance:0},{id:'s-cash',person:'Josna',type:'Cash',balance:0}],tx:[],trips:[],goals:{}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}let page='home',selectedMonth=monthNow();const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n)||0);function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}function account(id){return db.accounts.find(a=>a.id===id)}function totals(){let g={Current:0,Savings:0,Cash:0,'Credit Card':0};for(const a of db.accounts){if(a.type in g)g[a.type]+=Number(a.balance)||0}return g}function txImpact(t,sign=1){let n=Number(t.amount)||0;if(t.kind==='income'){let a=account(t.to);if(a)a.balance+=n*sign}else if(t.kind==='expense'){let a=account(t.from);if(a){if(a.type==='Credit Card')a.balance+=n*sign;else a.balance-=n*sign}}else if(t.kind==='transfer'){let a=account(t.from),b=account(t.to);if(a)a.balance-=n*sign;if(b)b.balance+=n*sign}}function addTx(t){t.id=t.id||crypto.randomUUID();db.tx.push(t);txImpact(t);persist()}function editTx(id,patch){let t=db.tx.find(x=>x.id===id);if(!t)return;txImpact(t,-1);Object.assign(t,patch);txImpact(t);persist()}function delTx(id){let i=db.tx.findIndex(x=>x.id===id);if(i<0)return;txImpact(db.tx[i],-1);db.tx.splice(i,1);persist()}function acctSelect(type,sel,name,empty=false){return '<select name="'+name+'" required>'+(!empty?'':'<option value="">Choose account</option>')+db.accounts.filter(a=>!type||type.includes(a.type)).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.person)} · ${esc(a.type)}</option>`).join('')+'</select>'}function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalwrap').classList.add('show')}function closeModal(){$('#modalwrap').classList.remove('show')}$('#closeModal').onclick=closeModal;$('#modalwrap').onclick=e=>{if(e.target===$('#modalwrap'))closeModal()};function expenseModal(existing){let t=existing||{},editing=!!existing,form=`<form class="form" id="txForm"><div class="field"><label>Type</label><select name="kind" id="kind"><option value="expense" ${t.kind==='expense'?'selected':''}>Expense</option><option value="income" ${t.kind==='income'?'selected':''}>Income / payday</option><option value="transfer" ${t.kind==='transfer'?'selected':''}>Transfer between accounts</option></select></div><div class="field"><label>Amount (€)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${t.amount??''}" placeholder="0.00"></div><div class="field wide"><label>Description</label><input name="description" required value="${esc(t.description||'')}" placeholder="Salary, groceries…"></div><div class="field"><label>Date</label><input name="date" type="date" value="${t.date||today()}" required></div><div class="field"><label>Person</label><select name="person"><option ${t.person==='Jithu'?'selected':''}>Jithu</option><option ${t.person==='Josna'?'selected':''}>Josna</option><option ${t.person==='Family'?'selected':''}>Family</option></select></div><div class="field" id="fromField"><label id="fromLabel">Paid from</label><div id="fromSelect"></div></div><div class="field" id="toField"><label id="toLabel">Received into</label><div id="toSelect"></div></div><div class="field" id="categoryField"><label>Category</label><select name="category">${['Food','Home','Transport','Bills','Health','Shopping','Family','Travel','Other'].map(c=>`<option ${c===(t.category||'Other')?'selected':''}>${c}</option>`).join('')}</select></div><div class="field" id="recField"><label>Recurring?</label><select name="frequency"><option value="none">No</option>${['Weekly','Fortnightly','Monthly','Quarterly','Yearly'].map(x=>`<option ${t.frequency===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field wide"><label>Trip (optional)</label><select name="tripId"><option value="">No trip</option>${db.trips.map(x=>`<option value="${x.id}" ${t.tripId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="formbuttons">${editing?'<button type="button" class="delete" id="deleteTx">Delete</button>':''}<button class="primary save" type="submit">${editing?'Save changes':'Add entry'}</button></div></form>`;openModal(editing?'Edit entry':'Add an entry',form);const f=$('#txForm');function sync(){let k=$('#kind').value,fromTypes=k==='income'?['Current','Savings','Cash']:['Current','Savings','Cash','Credit Card'];if(k==='transfer')fromTypes=['Current','Savings','Cash','Credit Card'];$('#fromLabel').textContent=k==='income'?'Received into':k==='transfer'?'From account':'Paid from';$('#toLabel').textContent=k==='transfer'?'To account':'—';$('#fromSelect').innerHTML=acctSelect(k==='income'?['Current','Savings','Cash']:fromTypes,k==='income'?t.to:t.from,'from');$('#toField').style.display=k==='income'?'none':'grid';if(k==='transfer')$('#toSelect').innerHTML=acctSelect(null,t.to,'to',true);else if(k==='expense')$('#toSelect').innerHTML='<div class="muted" style="padding:10px 0">Expense</div>';$('#categoryField').style.display=k==='expense'?'grid':'none';$('#recField').style.display=k==='expense'?'grid':'none'}$('#kind').onchange=sync;sync();if(editing)$('#deleteTx').onclick=()=>{if(confirm('Delete this entry? The account balances will be recalculated.')){delTx(t.id);closeModal()}};f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),kind=d.get('kind'),amount=Number(d.get('amount')),source=d.get('from');if(kind==='transfer'&&source===d.get('to'))return alert('Choose two different accounts.');let obj={id:t.id,kind,amount,description:d.get('description').trim(),date:d.get('date'),person:d.get('person'),category:kind==='expense'?d.get('category'):'',frequency:kind==='expense'?d.get('frequency'):'none',tripId:kind==='expense'?d.get('tripId'):'',from:kind==='income'?'':source,to:kind==='income'?source:kind==='transfer'?d.get('to'):''};if(editing)editTx(t.id,obj);else addTx(obj);closeModal()}}function accountEdit(a){openModal('Edit balance',`<form class="form" id="balForm"><div class="field wide"><label>${esc(a.person)} · ${esc(a.type)} balance (€)</label><input name="balance" type="number" step="0.01" required value="${Number(a.balance).toFixed(2)}"></div><div class="field wide"><span class="muted" style="font-size:12px">Set the current balance. This adjusts the starting balance and keeps your transaction history.</span></div><div class="formbuttons"><button type="button" class="secondary" id="close2">Cancel</button><button class="primary save">Save balance</button></div></form>`);$('#close2').onclick=closeModal;$('#balForm').onsubmit=e=>{e.preventDefault();a.balance=Number(new FormData(e.target).get('balance'));persist();closeModal()}}
function renderHome(){let s=totals(),net=s.Current+s.Savings+s.Cash,m=db.tx.filter(t=>t.date?.startsWith(selectedMonth)),inc=m.filter(t=>t.kind==='income').reduce((a,t)=>a+Number(t.amount),0),sp=m.filter(t=>t.kind==='expense').reduce((a,t)=>a+Number(t.amount),0),saved=inc-sp;return `<section class="hero"><div class="eyebrow">Total money we have</div><h1>${money(net)}</h1><p>Current + savings + cash · credit cards shown separately</p></section><div class="grid"><div class="card stat"><label>Combined current</label><strong>${money(s.Current)}</strong></div><div class="card stat"><label>Combined savings</label><strong>${money(s.Savings)}</strong></div><div class="card stat"><label>Cash</label><strong>${money(s.Cash)}</strong></div><div class="card stat"><label>Credit card balances</label><strong class="negative">${money(s['Credit Card'])}</strong></div></div><div class="section"><div class="sectionhead"><h2>Accounts</h2><span class="muted" style="font-size:12px">Tap a balance to edit</span></div><div class="accounts">${['Jithu','Josna'].map(p=>`<div class="card person"><h3>${p}</h3>${['Current','Savings','Credit Card','Cash'].map(type=>{let a=db.accounts.find(x=>x.person===p&&x.type===type);return `<div class="accountrow"><span>${type}</span><button data-account="${a.id}">${money(a.balance)}</button></div>`}).join('')}</div>`).join('')}</div></div><div class="section"><div class="sectionhead"><h2>This month</h2>${monthControl()}</div><div class="monthgrid"><div class="card stat"><label>Income</label><strong class="positive">${money(inc)}</strong></div><div class="card stat"><label>Expenses</label><strong>${money(sp)}</strong></div><div class="card stat"><label>${saved>=0?'Net saved':'Over income'}</label><strong class="${saved>=0?'positive':'negative'}">${money(saved)}</strong></div></div></div><div class="section"><div class="sectionhead"><h2>Recent activity</h2><button class="primary" data-add>Add entry</button></div>${txList(m.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div>`}function monthControl(){return `<div class="monthnav"><button data-month="-1">‹</button><strong style="font-size:13px">${new Date(selectedMonth+'-02').toLocaleDateString('en-IE',{month:'long',year:'numeric'})}</strong><button data-month="1">›</button></div>`}function txList(items){if(!items.length)return '<div class="empty">Nothing recorded here yet. Add an entry to get started.</div>';return `<div class="simplelist">${items.map(t=>{let sign=t.kind==='income'?'+':t.kind==='expense'?'−':'↔';let accountName=t.kind==='income'?account(t.to)?.type:t.kind==='expense'?account(t.from)?.type:(account(t.from)?.type+' → '+account(t.to)?.type);return `<div class="row"><div style="min-width:0"><div class="rowtitle">${esc(t.description)}${t.tripId?' <span class="pill">Trip</span>':''}</div><div class="rowmeta">${new Date(t.date+'T12:00:00').toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'})} · ${esc(t.person||'')} · ${esc(t.category||accountName||'')}</div></div><div style="text-align:right"><div class="rowamt ${t.kind==='income'?'positive':t.kind==='expense'?'':'muted'}">${sign} ${money(t.amount)}</div><button data-edit="${t.id}" style="background:none;color:var(--green);font-size:12px;padding:5px 0 0">Edit</button></div></div>`}).join('')}</div>'}function renderSpending(){let items=db.tx.filter(t=>t.date?.startsWith(selectedMonth));let incomes=items.filter(t=>t.kind==='income'),expenses=items.filter(t=>t.kind==='expense'),recurring=db.tx.filter(t=>t.kind==='expense'&&t.frequency&&t.frequency!=='none');return `<div class="sectionhead"><h2>Spending</h2><div class="toolbar">${monthControl()}<button class="primary" data-add>Add entry</button></div></div><div class="monthgrid"><div class="card stat"><label>Income this month</label><strong class="positive">${money(incomes.reduce((a,t)=>a+t.amount,0))}</strong></div><div class="card stat"><label>Expenses this month</label><strong>${money(expenses.reduce((a,t)=>a+t.amount,0))}</strong></div><div class="card stat"><label>Entries</label><strong>${items.length}</strong></div></div><div class="section"><div class="sectionhead"><h2>Entries</h2><span class="muted" style="font-size:12px">Expenses, income and transfers</span></div>${txList(items.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div><div class="section"><div class="sectionhead"><h2>Recurring expenses</h2><span class="muted" style="font-size:12px">Templates for reference</span></div>${txList(recurring.slice().sort((a,b)=>a.description.localeCompare(b.description)))}</div>`}function renderTrips(){let cards=db.trips.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(tr=>{let tx=db.tx.filter(t=>t.tripId===tr.id&&t.kind==='expense'),sum=tx.reduce((n,t)=>n+Number(t.amount),0),who=['Jithu','Josna'].map(p=>`<span class="pill">${p}: ${money(tx.filter(t=>t.person===p).reduce((n,t)=>n+t.amount,0))}</span>`).join('');return `<article class="card tripcard"><div class="triphead"><div><h3>${esc(tr.name)}</h3><div class="rowmeta">${tr.start?new Date(tr.start+'T12:00:00').toLocaleDateString('en-IE'):'Date not set'}${tr.end?' → '+new Date(tr.end+'T12:00:00').toLocaleDateString('en-IE'):''} · ${tr.status==='completed'?'Completed':'In progress'}</div></div><div><button data-trip-edit="${tr.id}" style="background:none;color:var(--green);font-size:12px">Edit trip</button> <button data-trip-delete="${tr.id}" style="background:none;color:var(--red);font-size:12px">Delete</button></div></div><div class="triptotal">${money(sum)} <span class="muted" style="font-size:13px;font-weight:500">${tr.status==='completed'?'final trip total':'spent so far'}</span></div><div style="display:flex;gap:8px;margin:12px 0">${who}</div><div class="sectionhead" style="margin-top:8px"><span class="muted" style="font-size:12px">${tx.length} expenses</span><button class="primary" data-trip-add="${tr.id}">Add expense</button></div>${txList(tx.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</article>`}).join('');return `<div class="sectionhead"><h2>Trips</h2><button class="primary" id="newTrip">+ New trip</button></div><p class="muted" style="margin:0 0 14px">Log trip costs here. They also appear in household spending and account balances exactly once.</p>${cards?`<div class="simplelist">${cards}</div>`:'<div class="empty">Your trips start at €0. Create a trip when you are ready to track spending.</div>'}`}
function renderProgress(){let items=db.tx.filter(t=>t.date?.startsWith(selectedMonth)),inc=items.filter(t=>t.kind==='income').reduce((n,t)=>n+t.amount,0),exp=items.filter(t=>t.kind==='expense').reduce((n,t)=>n+t.amount,0),net=inc-exp;let prior=new Date(selectedMonth+'-02');prior.setMonth(prior.getMonth()-1);let priorKey=prior.toISOString().slice(0,7),old=db.tx.filter(t=>t.date?.startsWith(priorKey)),oldNet=old.filter(t=>t.kind==='income').reduce((n,t)=>n+t.amount,0)-old.filter(t=>t.kind==='expense').reduce((n,t)=>n+t.amount,0);return `<div class="sectionhead"><h2>Progress</h2>${monthControl()}</div><section class="hero"><div class="eyebrow">Savings improvement · ${new Date(selectedMonth+'-02').toLocaleDateString('en-IE',{month:'long',year:'numeric'})}</div><h1>${money(net)}</h1><p>Income minus expenses recorded this month</p></section><div class="monthgrid"><div class="card stat"><label>Income</label><strong class="positive">${money(inc)}</strong></div><div class="card stat"><label>Expenses</label><strong>${money(exp)}</strong></div><div class="card stat"><label>Previous month</label><strong>${money(oldNet)}</strong></div></div><div class="section card"><div class="sectionhead"><div><h2>Monthly savings goal</h2><div class="rowmeta">Optional target to help you build savings</div></div><button id="goalEdit" class="secondary">${db.goals[selectedMonth]?'Edit':'Set goal'}</button></div>${db.goals[selectedMonth]?`<div style="font-size:22px;font-weight:750">${money(Math.max(0,net))} <span class="muted" style="font-size:15px;font-weight:500">of ${money(db.goals[selectedMonth])}</span></div><div class="progressbar"><i style="width:${Math.min(100,Math.max(0,net)/db.goals[selectedMonth]*100)}%"></i></div>`:'<p class="muted" style="margin-bottom:0">Set a monthly target if you want a simple progress marker.</p>'}</div><div class="section"><div class="sectionhead"><h2>Spending by category</h2></div>${(()=>{let cats={};items.filter(t=>t.kind==='expense').forEach(t=>cats[t.category||'Other']=(cats[t.category||'Other']||0)+t.amount);return Object.keys(cats).length?'<div class="simplelist">'+Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><strong>${money(v)}</strong></div>`).join('')+'</div>':'<div class="empty">Category totals appear as you record expenses.</div>'})()}</div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#quickAdd').style.display=page==='trips'?'none':'';$('#view').innerHTML=page==='home'?renderHome():page==='spending'?renderSpending():page==='trips'?renderTrips():renderProgress();$('#view').querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>accountEdit(account(b.dataset.account)));$('#view').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>expenseModal());$('#view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>expenseModal(db.tx.find(t=>t.id===b.dataset.edit)));$('#view').querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{let d=new Date(selectedMonth+'-02');d.setMonth(d.getMonth()+Number(b.dataset.month));selectedMonth=d.toISOString().slice(0,7);render()});if($('#newTrip'))$('#newTrip').onclick=()=>tripModal();$('#view').querySelectorAll('[data-trip-add]').forEach(b=>b.onclick=()=>expenseModal({kind:'expense',tripId:b.dataset.tripAdd,category:'Other'}));$('#view').querySelectorAll('[data-trip-edit]').forEach(b=>b.onclick=()=>tripModal(db.trips.find(t=>t.id===b.dataset.tripEdit)));$('#view').querySelectorAll('[data-trip-delete]').forEach(b=>b.onclick=()=>{let tr=db.trips.find(t=>t.id===b.dataset.tripDelete);if(confirm(`Delete ${tr.name}? Its expenses will remain as household expenses, with the trip link removed.`)){db.tx.forEach(t=>{if(t.tripId===tr.id)t.tripId='' });db.trips=db.trips.filter(x=>x.id!==tr.id);persist()}});if($('#goalEdit'))$('#goalEdit').onclick=()=>openModal('Monthly savings goal',`<form class="form" id="goalForm"><div class="field wide"><label>Target (€)</label><input type="number" name="goal" min="1" step="1" required value="${db.goals[selectedMonth]||''}"></div><div class="formbuttons"><button class="primary save">Save goal</button></div></form>`),$('#goalForm').onsubmit=e=>{e.preventDefault();db.goals[selectedMonth]=Number(new FormData(e.target).get('goal'));persist();closeModal()}}
function tripModal(tr){let edit=!!tr;openModal(edit?'Edit trip':'Create a trip',`<form class="form" id="tripForm"><div class="field wide"><label>Trip name</label><input name="name" required value="${esc(tr?.name||'')}" placeholder="e.g. India 2026"></div><div class="field"><label>Start date</label><input name="start" type="date" value="${tr?.start||''}"></div><div class="field"><label>End date</label><input name="end" type="date" value="${tr?.end||''}"></div><div class="field wide"><label>Status</label><select name="status"><option value="active" ${tr?.status!=='completed'?'selected':''}>In progress</option><option value="completed" ${tr?.status==='completed'?'selected':''}>Completed</option></select></div><div class="formbuttons">${edit?'<button class="delete" type="button" id="tripDel">Delete trip</button>':''}<button class="primary save">${edit?'Save trip':'Create trip'}</button></div></form>`);$('#tripForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),obj={id:tr?.id||crypto.randomUUID(),name:d.get('name').trim(),start:d.get('start'),end:d.get('end'),status:d.get('status')};if(edit)Object.assign(tr,obj);else db.trips.push(obj);persist();closeModal()};if(edit)$('#tripDel').onclick=()=>{if(confirm('Delete this trip? Expenses stay in household spending.')){db.tx.forEach(t=>{if(t.tripId===tr.id)t.tripId=''});db.trips=db.trips.filter(x=>x.id!==tr.id);persist();closeModal()}}}
$('.tabs').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};$('#quickAdd').onclick=()=>expenseModal();$('#settingsBtn').onclick=()=>settings();$('#backupBtn').onclick=backup;$('#backupLink').onclick=settings;function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JJ-Family-Finance-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function settings(){openModal('Data & setup',`<p class="muted" style="margin-top:0">Your information is stored in this browser. Save a backup before moving to another device.</p><div style="display:grid;gap:10px"><button class="primary" id="setupBtn">Set account balances</button><button class="secondary" id="exportBtn">Download backup</button><button class="secondary" id="restoreBtn">Restore from backup</button><button class="delete" id="resetBtn">Reset all data to zero</button></div>`);$('#setupBtn').onclick=()=>{closeModal();setupBalances()};$('#exportBtn').onclick=backup;$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#resetBtn').onclick=()=>{if(confirm('Reset all accounts, entries, trips and goals to zero? This cannot be undone.')){db=seed();persist();closeModal()}}}function setupBalances(){openModal('Set starting balances',`<form class="form" id="setupForm">${db.accounts.map(a=>`<div class="field"><label>${esc(a.person)} · ${esc(a.type)} (€)</label><input type="number" step="0.01" name="${a.id}" value="${Number(a.balance).toFixed(2)}" required></div>`).join('')}<div class="formbuttons"><button class="primary save">Save balances</button></div></form>`);$('#setupForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);db.accounts.forEach(a=>a.balance=Number(d.get(a.id)));persist();closeModal()}}$('#restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.tx)||!Array.isArray(data.trips))throw Error('Invalid backup format');if(confirm('Restore this backup? Current data in this browser will be replaced.')){db=data;persist();closeModal()}}catch(err){alert('Could not restore that file: '+err.message)}e.target.value=''};render();})();
</script></body></html>
